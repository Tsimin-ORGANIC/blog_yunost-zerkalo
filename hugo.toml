# ── 站点基础信息 ─────────────────────────────────────────────
# 钇·锆·拾遗 —— Yunost Zerkalo (Юность Зеркало) · Y-Zr
# 部署到 GitHub Pages 后 Actions 会自动覆盖 baseURL，这里主要是本地预览用
baseURL = 'https://example.github.io/yunost-zerkalo/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = '钇·锆·拾遗'
theme = 'stack'

# 部署到 GitHub Pages 时必须保留，否则构建产物会在仓库里
canonifyURLs = true
enableRobotsTXT = true

# 网站描述（RSS 等处会用；主题的 meta description 见下面 params.description）
description = '钇·锆·拾遗 · Юность Зеркало —— 捡一些碎片，为将来的过去拾遗补缺。'

# 列表页默认取 content/posts/ 下的文章
mainSections = ['posts']

# 版权信息，显示在页脚
copyright = 'Y-Zr · 本馆档案采用 CC BY-NC-SA 4.0 协议'

# 分页（新版 Hugo 用 [pagination] 代替旧的 paginate）
[pagination]
  pagerSize = 10

# 文章用短链接 /p/:slug/；归档/搜索/关于三个页面的地址在各页面 front matter 里指定
[permalinks]
  posts = '/p/:slugorcontentbasename/'

# ── 菜单（右上角导航）────────────────────────────────────────
[menu]
  [[menu.main]]
    identifier = 'home'
    name = '总目'
    url = '/'
    weight = 1

  [[menu.main]]
    identifier = 'archives'
    name = '库房'
    url = '/archives/'
    weight = 2

  [[menu.main]]
    identifier = 'about'
    name = '登记簿'
    url = '/about/'
    weight = 3

  [[menu.main]]
    identifier = 'search'
    name = '检索'
    url = '/search/'
    weight = 4

# ── Stack 主题参数 ───────────────────────────────────────────
[params]
  # 搜索引擎与社交分享卡片上的站点描述
  # （主题取的是 params.description；sidebar.subtitle 只负责侧栏那行小字）
  description = '钇·锆·拾遗 · Юность Зеркало —— 捡一些碎片，为将来的过去拾遗补缺。'
  mainSections = ['posts']
  rssFullContent = true

  # 侧栏
  [params.sidebar]
    compact = false
    # 头像：放一张图到 static/img/avatar.jpg 后填 '/img/avatar.jpg'
    avatar = ''
    # 档案编号章（代替原来的小表情）
    emoji = '☸'
    # 侧栏名字下面的一行小字
    subtitle = 'Юность Зеркало'

  # 文章页
  [params.article]
    toc = true            # 目录
    readingTime = true    # 阅读时长（i18n 里显示为"预估传阅时间"）
    headingAnchor = true  # 标题锚点，方便引用某一段

    [params.article.list]
      showTags = true     # 列表页直接显示标签

    # 文末版权声明
    [params.article.license]
      enabled = true
      default = '档案状态：公开传阅 · CC BY-NC-SA 4.0'

  # 首页侧边小工具
  [params.widgets]
    homepage = [
      { type = 'search' },
      { type = 'archives', params = { limit = 5 } },
      { type = 'tag-cloud', params = { limit = 10 } },
    ]
    page = [{ type = 'toc' }]

  # 明暗色切换：档案室常夜，默认暗色，仍可手动切换
  [params.colorScheme]
    toggle = true
    default = 'dark'

  # 暂时不开评论系统；想开的话推荐 giscus（基于 GitHub Discussions）
  [params.comments]
    enabled = false

  # 页脚
  [params.footer]
    since = 2026

  # 日期显示格式（公文式：ISO 数字日期）
  [params.dateFormat]
    published = '2006-01-02'
    lastUpdated = '2006-01-02'

  # 图片压缩（列表缩略图、正文图自动生成多档宽度）
  [params.imageProcessing.content]
    enabled = true
  [params.imageProcessing.thumbnail]
    enabled = true
