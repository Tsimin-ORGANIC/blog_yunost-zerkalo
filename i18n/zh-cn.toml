# 钇·锆·拾遗 —— Yunost Zerkalo · 档案室用语
toggleMenu = "展开登记窗口"
darkMode   = "库房亮灯"

[list]
    page       = "共 {{ .Count }} 份卷宗"
    section    = "库房分区"
    subsection = "附属库房"

[article]
    back            = "归还卷宗"
    tableOfContents = "卷宗目录"
    relatedContent  = "同一案卷的相关档案"
    lastUpdatedOn   = "最后一次修订："
    readingTime     = "预估传阅时间：{{ .Count }} 分钟"

    [article.alert]
        note      = "备注"
        tip       = "提示"
        important = "重要"
        warning   = "警告"
        caution   = "注意"

    [article.codeblock]
        copy   = "抄录"
        copied = "已抄录！"

[notFound]
    title    = "档案编号 404"
    subtitle = "该卷宗已转移至未知库房"

[widget]
    [widget.archives]
        title = "移交记录"
        more  = "调阅更多"

    [widget.tagCloud]
        title = "案卷标签"

    [widget.categoriesCloud]
        title = "档案分类"

[search]
    title       = "检索"
    placeholder = "输入案卷关键词..."
    resultTitle = "检索到 #PAGES_COUNT 份档案（用时 #TIME_SECONDS 秒）"

[footer]
    builtWith  = "本馆由 {{ .Generator }} 建造"
    designedBy = "库房章程 {{ .Theme }} 由 {{ .DesignedBy }} 起草"

[cookies]
    title             = "Cookie 同意"
    text              = "我们使用 Cookie 来增强您的浏览体验并分析网站流量。"
    acceptAll         = "接受所有"
    deny              = "拒绝"
    managePreferences = "管理偏好设置"
    settingsTitle     = "Cookie 偏好设置"
    savePreferences   = "保存偏好设置"
    cancel            = "取消"
    footerLink        = "Cookie 设置"
    commentsDisabled  = "评论已禁用，直到您接受功能性 Cookie。"

    [cookies.necessary]
        title = "必要"
        text  = "这些 Cookie 是网站运行所必需的，无法禁用。"

    [cookies.analytics]
        title = "分析"
        text  = "这些 Cookie 帮助我们了解访问者如何与我们的网站互动。"

    [cookies.functional]
        title = "功能性"
        text  = "这些 Cookie 启用评论和嵌入内容等功能."

[pagination]
    jumpToPage = "跳转到卷宗页码"
    jump       = "跳转"
    pressEnter = "按 Enter 键跳转"
