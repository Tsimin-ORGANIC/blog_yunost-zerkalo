# 把 Hugo 站点自动构建并发布到 GitHub Pages
# 使用前：仓库 Settings → Pages → Source 选 "GitHub Actions"
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 主题已直接打包在仓库内，无需拉取子模块

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 钉住版本：与本机验证过的版本一致，避免上游发新版导致构建突然失败
          # 想升级时改这里，并在本机用同版本 hugo 跑一遍确认无误
          hugo-version: '0.163.3'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开启（省掉手动去 Settings 里点）
          enablement: true

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
